<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulatrón | Error 404</title>

    <!-- Google Fonts: JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ESTILOS AUTOCONTENIDOS (SIMULATRÓN STANDARD) -->
    <style>
      :root {
        --bg-surface: #f1f1e6;
        --text-main: #282828;
        --border-color: #282828;
        --font-mono: "JetBrains Mono", "Courier New", monospace;
        --shadow-retro: 4px 4px 0px #000000;
        --color-accent: #02872a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-surface);
        color: var(--text-main);
        font-family: var(--font-mono);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        line-height: 1.6;
      }

      /* Efecto cuadrícula retro de fondo */
      .bg-grid {
        background-size: 30px 30px;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
      }

      .hub-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* Tarjeta técnica retro */
      .custom-card {
        background: #ffffff;
        border: 2px solid var(--border-color);
        box-shadow: var(--shadow-retro);
        border-radius: 0;
        overflow: hidden;
        width: 100%;
        max-width: 520px;
      }

      .custom-card-header {
        background-color: var(--border-color);
        color: #ffffff;
        border-bottom: 2px solid var(--border-color);
        padding: 10px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 800;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .card-body {
        padding: 35px 25px;
      }

      /* Botón técnico interactivo */
      .btn-tech {
        background-color: var(--border-color);
        color: #ffffff !important;
        border: 2px solid var(--border-color);
        border-radius: 0;
        font-weight: 800;
        text-transform: uppercase;
        text-decoration: none;
        padding: 12px 20px;
        display: inline-block;
        transition: all 0.15s ease-in-out;
        cursor: pointer;
      }

      .btn-tech:hover {
        background-color: var(--color-accent);
        border-color: #000000;
        color: #ffffff !important;
        transform: translate(-2px, -2px);
        box-shadow: 3px 3px 0px #000000;
      }

      .status-tag-error {
        background-color: #ef4444;
        color: #ffffff;
        font-size: 0.7rem;
        font-weight: 800;
        padding: 2px 8px;
        border: 1px solid #000000;
      }
    </style>
  </head>
  <body class="bg-grid">
    <div class="hub-wrapper">
      <div class="custom-card">
        <div class="custom-card-header">
          <span>Error de Navegación</span>
          <span class="status-tag-error">HTTP 404</span>
        </div>
        <div class="card-body text-center">
          <h1 class="display-1 fw-bolder mb-2" style="letter-spacing: -3px">
            404
          </h1>
          <p class="text-uppercase fw-bold mb-3 fs-5">Ruta no encontrada</p>
          <p class="small text-muted mb-4">
            El archivo o la materia solicitada aún no ha sido implementada en el
            sistema Simulatrón. Verifique la dirección o regrese al panel central.
          </p>
          <a href="./index.html" class="btn btn-tech w-100">
            VOLVER AL HUB
          </a>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulatrón | Examen Integrador de Biología</title>
    <!-- Fonts & Styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="../icono.png" />
  </head>
  <body class="bg-grid">
    <!-- BARRA SUPERIOR STICKY -->
    <nav
      class="sticky-top-bar shadow-sm py-2 mb-4"
      style="
        background: var(--bg-surface);
        border-bottom: 2px solid var(--text-main);
        position: sticky;
        top: 0;
        z-index: 1000;
      "
    >
      <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html" class="btn btn-outline-tech btn-sm">Volver</a>
        <span class="fw-bold text-uppercase small"
          >Examen Integrador de Biología</span
        >
        <span id="score-counter" class="badge bg-dark text-white fw-bold"
          >Puntaje: 0</span
        >
      </div>
    </nav>

    <div class="container py-3" style="max-width: 800px">
      <!-- BARRA DE PROGRESO RETRO -->
      <div class="custom-card mb-4">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between small fw-bold mb-1">
            <span>PROGRESO DEL EXAMEN</span>
            <span id="progress-text">0 / 0</span>
          </div>
          <div
            class="progress rounded-0 border border-dark"
            style="height: 16px; background-color: #e0e0e0"
          >
            <div
              id="progress-bar"
              class="progress-bar bg-success"
              role="progressbar"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>

      <!-- CONTENEDOR DE LA PREGUNTA -->
      <div class="custom-card mb-4" id="question-card">
        <div
          class="custom-card-header bg-dark text-white d-flex justify-content-between"
        >
          <span id="question-header">Cargando evaluación...</span>
          <span id="question-level" class="badge bg-success text-dark"
            >NIVEL</span
          >
        </div>
        <div class="card-body p-4">
          <h4 id="question-text" class="fw-bold mb-4">
            Cargando contenido de la evaluación...
          </h4>
          <div id="options-container" class="d-grid gap-3"></div>
        </div>
        <div
          class="card-footer bg-light p-3 border-top border-dark d-flex justify-content-between"
        >
          <button id="btn-next" class="btn btn-tech w-100 d-none">
            SIGUIENTE PREGUNTA ►
          </button>
        </div>
      </div>

      <!-- FEEDBACK PANEL -->
      <div id="feedback-panel" class="d-none"></div>
    </div>

    <!-- MODAL DE RESULTADOS FINALES -->
    <div
      id="modal-resultado"
      class="d-none"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      "
    >
      <div class="custom-card mx-3" style="max-width: 550px; width: 100%">
        <div class="custom-card-header bg-dark text-white">
          RESULTADOS DEL EXAMEN INTEGRADOR
        </div>
        <div class="card-body text-center p-5">
          <h2 class="display-4 fw-bolder mb-2" id="final-score-percent">0%</h2>
          <h4 class="fw-bold text-uppercase mb-3" id="final-status-title">
            EVALUANDO...
          </h4>
          <p class="text-muted small mb-4" id="final-status-msg">
            Procesando métricas de evaluación...
          </p>

          <div class="bio-block mb-4">
            <strong>Correctas:</strong> <span id="correct-count">0</span> /
            <span id="total-count">0</span>
          </div>

          <div class="d-grid gap-2">
            <button onclick="location.reload()" class="btn btn-outline-tech">
              REINTENTAR EXAMEN
            </button>
            <a href="index.html" class="btn btn-tech"
              >VOLVER AL HUB DE BIOLOGÍA</a
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Carga del banco de preguntas y script del examen -->
    <script type="module">
      import { bancoPreguntas } from "./js/preguntas.js";

      // FUNCION DE SANITIZACIÓN OBLIGATORIA (Simulatrón Standard)
      function escaparHtml(cadena) {
        if (typeof cadena !== "string") return cadena;
        return cadena
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // ESTADO DEL EXAMEN
      let preguntasExamen = [];
      let indiceActual = 0;
      let puntaje = 0;
      let respondida = false;

      // DOM ELEMENTS
      const qHeader = document.getElementById("question-header");
      const qLevel = document.getElementById("question-level");
      const qText = document.getElementById("question-text");
      const optionsContainer = document.getElementById("options-container");
      const btnNext = document.getElementById("btn-next");
      const feedbackPanel = document.getElementById("feedback-panel");
      const progressText = document.getElementById("progress-text");
      const progressBar = document.getElementById("progress-bar");
      const scoreCounter = document.getElementById("score-counter");

      // INICIALIZACIÓN
      document.addEventListener("DOMContentLoaded", () => {
        // Seleccionar una muestra de 15 preguntas variadas de todos los niveles
        preguntasExamen = [...bancoPreguntas]
          .sort(() => Math.random() - 0.5)
          .slice(0, 15);

        actualizarProgreso();
        renderizarPregunta();
      });

      function renderizarPregunta() {
        respondida = false;
        btnNext.classList.add("d-none");
        feedbackPanel.classList.add("d-none");

        const q = preguntasExamen[indiceActual];
        qHeader.innerText = `PREGUNTA ${indiceActual + 1} DE ${preguntasExamen.length}`;
        qLevel.innerText = `NIVEL ${q.nivel} - ${q.tema.toUpperCase()}`;

        // USANDO ESCAPARHTML OBLIGATORIAMENTE PARA LA PREGUNTA
        qText.innerHTML = escaparHtml(q.pregunta);

        optionsContainer.innerHTML = "";
        q.opciones.forEach((opcion, idx) => {
          const btn = document.createElement("button");
          btn.className = "btn btn-outline-tech text-start p-3 fw-bold";
          // USANDO ESCAPARHTML OBLIGATORIAMENTE PARA LAS OPCIONES
          btn.innerHTML = `<span class="me-2 text-success">[${String.fromCharCode(65 + idx)}]</span> ${escaparHtml(opcion)}`;
          btn.onclick = () => seleccionarRespuesta(idx, btn);
          optionsContainer.appendChild(btn);
        });
      }

      function seleccionarRespuesta(idxSeleccionado, btnSeleccionado) {
        if (respondida) return;
        respondida = true;

        const q = preguntasExamen[indiceActual];
        const opcionesBtns = optionsContainer.children;

        // Deshabilitar todos los botones
        Array.from(opcionesBtns).forEach((b) => (b.disabled = true));

        if (idxSeleccionado === q.correcta) {
          puntaje++;
          scoreCounter.innerText = `Puntaje: ${puntaje}`;
          btnSeleccionado.className =
            "btn btn-tech text-start p-3 fw-bold animate__animated animate__pulse";
          mostrarFeedback(
            true,
            "Respuesta correcta. Concepto biológico verificado.",
          );
        } else {
          btnSeleccionado.className =
            "btn btn-danger text-start p-3 fw-bold text-white animate__animated animate__shakeX";
          opcionesBtns[q.correcta].className =
            "btn btn-tech text-start p-3 fw-bold";
          mostrarFeedback(
            false,
            `Incorrecto. La respuesta adecuada era: "${escaparHtml(q.opciones[q.correcta])}".`,
          );
        }

        btnNext.classList.remove("d-none");
      }

      function mostrarFeedback(esCorrecto, mensaje) {
        feedbackPanel.className = esCorrecto
          ? "alert alert-success-tech p-3 mb-4 animate__animated animate__fadeIn"
          : "alert alert-error-tech p-3 mb-4 animate__animated animate__fadeIn";
        feedbackPanel.innerHTML = `<strong>${esCorrecto ? "¡CORRECTO!" : "¡ATENCIÓN!"}</strong> ${mensaje}`;
        feedbackPanel.classList.remove("d-none");
      }

      btnNext.onclick = () => {
        indiceActual++;
        actualizarProgreso();

        if (indiceActual < preguntasExamen.length) {
          renderizarPregunta();
        } else {
          finalizarExamen();
        }
      };

      function actualizarProgreso() {
        const total = preguntasExamen.length;
        const porcentaje = Math.round((indiceActual / total) * 100);
        progressText.innerText = `${indiceActual} / ${total}`;
        progressBar.style.width = `${porcentaje}%`;
      }

      function finalizarExamen() {
        const total = preguntasExamen.length;
        const porcentajeFinal = Math.round((puntaje / total) * 100);

        document.getElementById("final-score-percent").innerText =
          `${porcentajeFinal}%`;
        document.getElementById("correct-count").innerText = puntaje;
        document.getElementById("total-count").innerText = total;

        const titleEl = document.getElementById("final-status-title");
        const msgEl = document.getElementById("final-status-msg");

        if (porcentajeFinal >= 80) {
          titleEl.innerText = "¡EXCELENTE DOMINIO!";
          titleEl.className = "fw-bold text-uppercase mb-3 text-success";
          msgEl.innerText =
            "Has demostrado un conocimiento sólido de los fundamentos biológicos.";
        } else if (porcentajeFinal >= 60) {
          titleEl.innerText = "Aprobado";
          titleEl.className = "fw-bold text-uppercase mb-3 text-warning";
          msgEl.innerText =
            "Has superado el umbral básico. Se recomienda repasar los conceptos débiles.";
        } else {
          titleEl.innerText = "Requiere Repaso";
          titleEl.className = "fw-bold text-uppercase mb-3 text-danger";
          msgEl.innerText =
            "Te sugerimos consultar los apuntes técnicos de la bibliografía e intentar nuevamente.";
        }

        const modal = document.getElementById("modal-resultado");
        modal.classList.remove("d-none");
        modal.classList.add("d-flex");
      }
    </script>
  </body>
</html>

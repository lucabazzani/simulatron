<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misión Estrella: IT Support Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .terminal-window {
        background: #000;
        border: 2px solid #282828;
        border-radius: 0;
        padding: 20px;
        min-height: 400px;
        color: #fff;
        font-family: var(--font-mono);
      }
      .ticket-paper {
        background: #fdfdfd;
        border: 1px solid #ccc;
        border-top: 5px solid var(--primary-color);
        padding: 20px;
        box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.05);
        color: #282828;
      }
      .strategy-btn {
        text-transform: none;
        font-size: 0.9rem;
        text-align: left;
        padding: 15px;
        border: 2px solid #ddd;
        background: #fff;
        width: 100%;
        transition: 0.2s;
        margin-bottom: 10px;
      }
      .strategy-btn:hover {
        border-color: var(--primary-color);
        background: #f3efff;
      }
      .header-step {
        font-weight: 800;
        color: var(--primary-color);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 1px;
        margin-bottom: 5px;
        display: block;
      }
    </style>
  </head>
  <body class="bg-grid">
    <nav
      class="sticky-top-bar shadow-sm py-2 mb-4"
      style="
        background: var(--bg-surface);
        border-bottom: 2px solid var(--text-main);
        position: sticky;
        top: 0;
        z-index: 1000;
      "
    >
      <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html" class="btn btn-outline-tech btn-sm"
          >Abort Mission</a
        >
        <span class="fw-bold">SUPPORT SIMULATOR v1.6.0</span>
      </div>
    </nav>

    <div class="container pb-5">
      <div class="row g-4">
        <!-- LADO IZQUIERDO: EL INCIDENTE (Ticket de entrada) -->
        <div class="col-lg-5">
          <div class="custom-card">
            <div class="custom-card-header bg-dark text-white">
              Incoming Help Desk Ticket
            </div>
            <div class="card-body p-4 bg-light">
              <div id="ticket-area" class="ticket-paper">
                <!-- Se llena con JS -->
                <p class="small italic">
                  Connecting to communications server...
                </p>
              </div>

              <!-- PANEL DE FEEDBACK INTEGRADO -->
              <div
                id="feedback-panel"
                class="d-none mt-4 p-3 animate__animated"
              ></div>
            </div>
          </div>
        </div>

        <!-- LADO DERECHO: INTERACCIÓN LINGÜÍSTICA -->
        <div class="col-lg-7">
          <div class="terminal-window">
            <div id="interaction-content">
              <!-- Cargado por JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL DE CERTIFICACIÓN FINAL -->
    <div
      id="modal-logro"
      class="d-none"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
      "
    >
      <div
        class="custom-card animate__animated animate__zoomIn"
        style="max-width: 500px; width: 100%"
      >
        <div class="custom-card-header bg-dark text-white">
          <span>Job Completed</span>
        </div>
        <div class="card-body text-center p-5">
          <h2 class="fw-bold mb-3" style="color: var(--primary-color)">
            Certification Earned
          </h2>
          <p class="text-muted mb-4 small">
            Usted ha demostrado habilidades técnicas y lingüísticas superiores
            en la resolución de incidentes de IT. ¡Soporte técnico aprobado!
          </p>
          <a href="index.html" class="btn btn-tech w-100"
            >Regresar al simulador</a
          >
        </div>
      </div>
    </div>

    <script src="js/estrella.js"></script>
  </body>
</html>
